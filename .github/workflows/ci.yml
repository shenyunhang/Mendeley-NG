# Checks every push before an installer is ever built for it.
#
# release.yml only runs on v* tags and does `npm run dist`, which bundles
# whatever is in the checkout at that moment. A type error that only shows up
# in one of the two tsconfig projects used to be invisible until then, and
# `npm run typecheck` -- not `npx tsc --noEmit`, whose root config is empty --
# is the only command that checks both halves.
#
# The smoke suite is deliberately absent: it drives a real Electron window
# against the user's real library and real PDFs, and it measures one keystroke's
# main-thread cost. Neither a hosted runner nor a headless session can give
# that an honest answer, so it stays a local gate.

name: Type check and build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Check both TypeScript projects
        run: npm run typecheck

      # Pure-Node unit tests, unlike the smoke suite, need no window and no
      # real library.  They are the only automated check of the pure rules
      # shared by the main process and the renderer.
      - name: Run unit tests
        run: npm test

      - name: Build main, preload and renderer
        run: npm run build

      # A green build is not enough: electron-vite can emit a broken entry
      # point, drop the --smoke chunk, or fail to copy the pdf.js worker, and
      # all of those only show up at runtime on an installed machine.  Check
      # the artifacts themselves, with a Node script so the logic is identical
      # on every runner and needs no shell-specific tools or globbing.
      - name: Verify build artifacts
        shell: bash
        run: |
          node -e '
          const fs = require("fs")
          const path = require("path")
          const { execFileSync } = require("child_process")
          const mainDir = path.join("out", "main")
          const fail = (msg) => { console.error("build artifact check FAILED: " + msg); process.exit(1) }
          if (!fs.existsSync(mainDir)) fail("missing directory " + mainDir)
          const entries = fs.readdirSync(mainDir)
          const smokeChunks = entries.filter((name) => /^smoke-.*\.js$/.test(name))
          if (smokeChunks.length === 0) fail("no out/main/smoke-*.js chunk was produced")
          const toCheck = [path.join(mainDir, "index.js")]
          for (const name of smokeChunks) toCheck.push(path.join(mainDir, name))
          for (const file of toCheck) {
            if (!fs.existsSync(file)) fail("missing " + file)
            try {
              execFileSync(process.execPath, ["--check", file], { stdio: "pipe" })
            } catch (e) {
              fail("node --check failed for " + file + "\n" + String(e.stderr || e.message))
            }
            console.log("node --check OK  " + file)
          }
          const worker = path.join(mainDir, "pdf.worker.mjs")
          if (!fs.existsSync(worker)) fail("missing " + worker)
          const workerSize = fs.statSync(worker).size
          if (!(workerSize > 100000)) fail(worker + " is " + workerSize + " bytes; expected > 100000")
          console.log("pdf.worker.mjs OK  " + workerSize + " bytes")
          const indexSrc = fs.readFileSync(path.join(mainDir, "index.js"), "utf8")
          const re = /require\(\s*["\x27]\.\/(smoke-[^"\x27]+\.js)["\x27]\s*\)/g
          const referenced = new Set()
          let match
          while ((match = re.exec(indexSrc)) !== null) referenced.add(match[1])
          if (referenced.size === 0) fail("index.js has no require(\"./smoke-<hash>.js\") reference")
          for (const name of referenced) {
            const chunk = path.join(mainDir, name)
            if (!fs.existsSync(chunk)) fail("index.js requires missing chunk " + chunk)
            console.log("smoke chunk OK  " + chunk)
          }
          console.log("build artifacts OK")
          '
